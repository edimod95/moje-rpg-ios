name: Budowanie Gry na iPhone (.ipa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalacja Cordova
        run: |
          npm install -g cordova

      - name: Tworzenie projektu i budowanie IPA
        run: |
          # 1. Tworzymy czysty projekt Cordova
          cordova create mobilna_gra com.olek.mojerpg "Moje RPG"
          
          # 2. Podmieniamy folder na Twoją grę
          rm -rf mobilna_gra/www
          cp -R www mobilna_gra/www
          
          # 3. Wchodzimy do projektu i dodajemy platformę Apple
          cd mobilna_gra
          cordova platform add ios
          
          # 4. Budujemy wersję na emulator (iphonesimulator) - to całkowicie usuwa problem Code Signing i Team ID!
          cd platforms/ios
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphonesimulator BUILD_DIR=build
          
          # 5. Szukamy wygenerowanego folderu .app, tworzymy strukturę Payload i pakujemy do pliku .ipa
          mkdir -p ../../Payload
          find build -name "*.app" -exec cp -R {} ../../Payload/ \;
          cd ../..
          zip -r MojeRPG.ipa Payload

      - name: Udostepnienie gotowego pliku do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: Gra-RPG-iPhone
          path: MojeRPG.ipa
