name: Budowanie Gry na iPhone (.ipa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalacja Cordova
        run: |
          npm install -g cordova

      - name: Tworzenie projektu i budowanie IPA
        run: |
          # 1. Tworzymy czysty projekt Cordova (Nazwa BEZ spacji omija błąd Xcode!)
          cordova create mobilna_gra com.olek.mojerpg "MojeRPG"
          
          # 2. Podmieniamy folder na Twoją grę
          rm -rf mobilna_gra/www
          cp -R www mobilna_gra/www
          
          # 3. Wchodzimy do projektu i dodajemy platformę Apple
          cd mobilna_gra
          cordova platform add ios
          
          # 4. Skrypt automatycznie wyłączający Code Signing w Xcode (Hook)
          mkdir -p hooks/after_platform_add
          cat << 'EOF' > hooks/after_platform_add/disable-signing.js
          const fs = require('fs');
          const path = require('path');
          const pbxprojPath = path.join('platforms', 'ios', 'MojeRPG.xcodeproj', 'project.pbxproj');
          if (fs.existsSync(pbxprojPath)) {
              let content = fs.readFileSync(pbxprojPath, 'utf8');
              content = content.replace(/CODE_SIGNING_ALLOWED = YES/g, 'CODE_SIGNING_ALLOWED = NO');
              content = content.replace(/CODE_SIGNING_REQUIRED = YES/g, 'CODE_SIGNING_REQUIRED = NO');
              fs.writeFileSync(pbxprojPath, content);
              console.log('Hook: Pomyslnie wylaczono Code Signing w projekcie Xcode!');
          }
          EOF
          
          # Uruchamiamy skrypt naprawczy
          node hooks/after_platform_add/disable-signing.js
          
          # 5. Budowanie przez xcodebuild bez konfliktów nazw i bez podpisów
          cd platforms/ios
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_ENTITLEMENTS="" CODE_SIGNING_INJECT_BASE_ENTITLEMENTS=NO BUILD_DIR=build
          
          # 6. Szukamy wygenerowanego folderu .app i pakujemy do pliku .ipa
          mkdir -p ../../Payload
          find build -name "*.app" -exec cp -R {} ../../Payload/ \;
          cd ../..
          zip -r MojeRPG.ipa Payload

      - name: Udostepnienie gotowego pliku do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: Gra-RPG-iPhone
          path: MojeRPG.ipa
