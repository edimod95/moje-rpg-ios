name: Budowanie Gry na iPhone (.ipa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalacja Cordova
        run: |
          npm install -g cordova

      - name: Tworzenie projektu i budowanie IPA
        run: |
          # 1. Tworzymy czysty projekt Cordova
          cordova create mobilna_gra com.olek.mojerpg "Moje RPG"
          
          # 2. Podmieniamy folder na Twoją grę
          rm -rf mobilna_gra/www
          cp -R www mobilna_gra/www
          
          # 3. Wchodzimy do projektu i dodajemy platformę Apple
          cd mobilna_gra
          cordova platform add ios
          
          # 4. Tworzymy plik build.json, który informuje kompilator, żeby NIE wymagał podpisu dewelopera
          echo '{"ios":{"release":{"codeSignIdentity":"Don\u0027t Code Sign","developmentTeam":"","packageType":"adhoc"}}}' > build.json
          
          # 5. Budujemy aplikację za pomocą natywnego skryptu Cordova (to omija błąd 65)
          cordova build ios --release --device --buildConfig=build.json
          
          # 6. Pakujemy wygenerowaną paczkę do pliku .ipa
          mkdir -p ../Payload
          find platforms/ios/build/ -name "*.app" -exec cp -R {} ../Payload/ \;
          cd ..
          zip -r MojeRPG.ipa Payload

      - name: Udostepnienie gotowego pliku do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: Gra-RPG-iPhone
          path: MojeRPG.ipa
