name: Budowanie Gry na iPhone (.ipa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalacja Cordova
        run: |
          npm install -g cordova

      - name: Tworzenie projektu i budowanie IPA
        run: |
          # Tworzymy czysty projekt Cordova w chmurze
          cordova create mobilna_gra com.olek.mojerpg "Moje RPG"
          
          # Podmieniamy domyslny folder www na Twoja gre z GitHuba
          rm -rf mobilna_gra/www
          cp -R www mobilna_gra/www
          
          # Wchodzimy do projektu i budujemy wersje na iOS
          cd mobilna_gra
          cordova platform add ios
          cordova build ios --release --device -- --codeSignIdentity="Don't Code Sign" --developmentTeam="" --codeSignStyle="manual"
          
          # Pakujemy skompilowana aplikacje do pliku .ipa
          mkdir -p ../Payload
          cp -R platforms/ios/build/device/Moje\ RPG.app ../Payload/ 2>/dev/null || cp -R platforms/ios/build/device/MojeRPG.app ../Payload/ 2>/dev/null || cp -R platforms/ios/build/Release-iphoneos/Moje\ RPG.app ../Payload/ 2>/dev/null || find platforms/ios -name "*.app" -exec cp -R {} ../Payload/ \;
          cd ..
          zip -r MojeRPG.ipa Payload

      - name: Udostepnienie gotowego pliku do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: Gra-RPG-iPhone
          path: MojeRPG.ipa
