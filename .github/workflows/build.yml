name: Budowanie Gry na iPhone (.ipa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Zmieniłem też wersję na nowszą, żeby zniknęły żółte ostrzeżenia z logów

      - name: Instalacja zaleznosci projektu
        run: |
          npm install
          chmod +x ./node_modules/.bin/cap # Ta linijka naprawia błąd Permission Denied!
          npx cap sync ios

      - name: Budowanie pliku IPA (Unsigned)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -allowProvisioningUpdates CODE_SIGNING_ALLOWED=NO BUILD_DIR=build
          mkdir -p Payload
          mv build/Release-iphoneos/App.app Payload/ 2>/dev/null || mv build/UninstalledProducts/iphoneos/App.app Payload/
          zip -r ../../MojeRPG.ipa Payload

      - name: Udostepnienie gotowego pliku do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: Gra-RPG-iPhone
          path: MojeRPG.ipa
