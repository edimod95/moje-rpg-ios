name: Budowanie Gry na iPhone (.ipa)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-latest

    steps:
      - name: Pobranie kodu z repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalacja Cordova
        run: |
          npm install -g cordova

      - name: Tworzenie projektu i budowanie IPA
        run: |
          cordova create mobilna_gra com.olek.mojerpg "Moje RPG"
          
          rm -rf mobilna_gra/www
          cp -R www mobilna_gra/www
          
          cd mobilna_gra
          cordova platform add ios
          
          # Budujemy bezposrednio binarki kompilatorem Xcode omijajac blokady autoryzacji Apple
          cd platforms/ios
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO BUILD_DIR=build
          
          # Pakujemy do końcowego pliku .ipa
          mkdir -p ../../Payload
          cp -R build/Release-iphoneos/App.app ../../Payload/
          cd ../..
          zip -r MojeRPG.ipa Payload

      - name: Udostepnienie gotowego pliku do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: Gra-RPG-iPhone
          path: MojeRPG.ipa
